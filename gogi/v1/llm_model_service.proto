syntax = "proto3";
package gogi.v1;

option go_package = "gogi/gogi/v1;gogiv1";

import "gogi/v1/llm_tool.proto";
import "gogi/v1/llm_message.proto";

service LLMModelServer {

  // Core inference
  rpc Run(LLMRunRequest) returns (LLMRunResponse);
  rpc RunStream(LLMRunRequest) returns (stream LLMStreamChunkResponse);

  // Discovery
  // list the llms the platform supports
  rpc ListLLMs(ListLLMsRequest) returns (ListLLMsResponse);
  // Get the LLM capabilities the platform supports
  rpc GetLLMCapabilities(GetLLMCapabilitiesRequest) returns (LLMCapabilitiesResponse);
  
  // get the providers supported by the platform
  rpc GetLLMProviders(GetLLMProvidersRequest) returns (LLMProvidersResponse);

  // Custom model registry
  // Register a user model
  rpc RegisterLLM(RegisterLLMRequest) returns (RegisterLLMResponse);
  
  // Get all the user registered models
  rpc ListRegisteredLLMs(ListRegisteredLLMsRequest) returns (ListRegisteredLLMsResponse);

  // Get the status of the LLM
  rpc GetLLMStatus(GetLLMStatusRequest) returns (LLMStatusResponse);

  // Embedding models
  // Register a text embedding model the application hosts behind an OpenAI-compatible
  // embeddings endpoint; registering a name again replaces it
  rpc RegisterEmbeddingModel(RegisterEmbeddingModelRequest) returns (EmbeddingModel);

  // List the embedding models the application can use: those gogi runs, OpenAI's, and its own
  rpc ListEmbeddingModels(ListEmbeddingModelsRequest) returns (ListEmbeddingModelsResponse);

  // Embed texts with an embedding model
  rpc Embed(EmbedRequest) returns (EmbedResponse);

}


// Specifies how to call an LLM
message LLMRunRequestConfig{
    string model = 1;
    string provider = 2;
    float temperature = 3;
    int32 max_tokens = 4;
    float top_p = 5;
    repeated string stop_sequences = 6;
    float frequency_penalty = 7;
    float presence_penalty = 8;
    string system_prompt_name = 9;
    // how failed calls are retried and which models are tried if the model fails.
    // If not set, the platform's defaults apply
    optional FallbackConfig fallback = 10;
}

// How the platform retries a failed call to a model. Only errors that may go away
// are retried: rate limits, overloaded or failing servers, timeouts and network
// errors. The platform caps every value; unset values take the platform's defaults
message RetryConfig{
    // how many times a failed call is retried; 0 means it is not retried
    optional int32 max_retries = 1;
    // the delay before the first retry; the delay doubles on every retry
    optional int32 initial_delay_ms = 2;
    // the longest delay between two retries
    optional int32 max_delay_ms = 3;
}

// A model to fall back to
message FallbackModel{
    string provider = 1;
    string model = 2;
}

// What to do when a call to the model fails, after its retries
message FallbackConfig{
    // false turns off falling back, including to the platform's default models.
    // Not set means true
    optional bool enabled = 1;
    // the models to try, in order, if the model fails. They replace the platform's
    // default models; if empty, the defaults are used
    repeated FallbackModel models = 2;
    // how failed calls to each model are retried
    optional RetryConfig retry = 3;
}

message LLMRunRequest{
    repeated LLMMessage messages = 1;
    LLMRunRequestConfig config = 2;
    repeated ToolDefinition tools = 3;
    optional ResponseFormat response_format = 4;
}

message LLMRunResponse{

    string content = 1;
    string model = 2;
    string provider = 3;
    TokenUsage usage = 4;
    repeated ToolCall tool_calls = 5;
    string finish_reason = 6;

}

message LLMStreamChunkResponse{
    string token = 1;
    string model = 2;
    optional string finish_reason = 3;
    optional TokenUsage usage = 4;
    // the tools the model calls, complete; sent with the last chunk
    repeated ToolCall tool_calls = 5;
    // the provider that answers; differs from the requested one after a fallback
    string provider = 6;
}

message ListLLMsRequest{
  // TODO: Not all owners may have access to the models
}

message ListLLMsResponse{
  repeated ModelInfo models = 1;
}

message LLMCapabilities{
    int32 context_window = 1;
    bool supports_vision = 2;
    bool supports_tools = 3;
    bool supports_streaming = 4;
    bool supports_json_mode = 5;
}

message ModelInfo {
    string name = 1;
    string provider = 2;
    LLMCapabilities capabilities = 3;
}

message GetLLMCapabilitiesRequest{
  string model = 1;
}


message LLMCapabilitiesResponse{
    LLMCapabilities capabilities = 1;
}


message Provider{
  string name = 1;
  repeated string models = 2;
}

message GetLLMProvidersRequest{
   bool fetch_models = 1;
}

message LLMProvidersResponse{
	repeated Provider providers = 1;
}

message RegisterLLMRequest{
    ModelInfo info = 1;
    string endpoint = 2;
    string health_check = 3;
    string adapter_type = 4;
    // names a credential held by the platform's credential store, e.g. "ml-inference-prod";
    // the secret itself never appears in the registration. Empty if the endpoint needs none
    string credential_ref = 5;
}

message RegisterLLMResponse{
    string name = 1;
    string status = 2;
    string  registered_at = 3;
}


message RegisteredLLM {
    ModelInfo info = 1;
    string endpoint = 2;
    string health_check = 3;
    string status = 4;
    string registered_at = 5;
    string adapter_type = 6;
    string credential_ref = 7;
}

message ListRegisteredLLMsRequest{
  // TODO: This may be per owner?
}

message ListRegisteredLLMsResponse{
  repeated RegisteredLLM models = 1;
}

message GetLLMStatusRequest{
 string name = 1;
}

message LLMStatusResponse{
  string name = 1;
    string status = 2;
    string last_checked = 3;
    string endpoint = 4;
}

