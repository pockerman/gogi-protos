syntax = "proto3";
package gogi.v1;

option go_package = "gogi/gogi/v1;gogiv1";

service IndexService {
	rpc CreateIndex(CreateIndexRequest) returns (IndexResponse);
    rpc GetIndexByName(GetIndexByNameRequest) returns (IndexResponse);
    rpc GetIndexById(GetIndexByIdRequest) returns (IndexResponse);
    rpc ListIndexes(ListIndexesRequest) returns (ListIndexesResponse);
    rpc DeleteIndexByName(DeleteIndexByNameRequest) returns (DeleteIndexResponse);
    rpc DeleteIndexById(DeleteIndexByIdRequest) returns (DeleteIndexResponse);
    rpc DeleteOwnerIndexes(DeleteOwnerIndexesRequest) returns (DeleteIndexResponse);

    // gives a user a role on an index, or changes the role they have
    rpc SetIndexMember(SetIndexMemberRequest) returns (IndexResponse);
    // takes a user off an index; fails with FAILED_PRECONDITION for its last owner
    rpc RemoveIndexMember(RemoveIndexMemberRequest) returns (IndexResponse);
}

// Types for the index serice
message IndexConfig {
    string name = 1;
    string embedding_model = 2;
    int32 embedding_dimensions = 3;
    string chunking_strategy = 4;
    int32 chunk_size = 5;
    int32 chunk_overlap = 6;
    map<string, string> metadata_schema = 7;
}


// what a member of an index may do with it
enum IndexMemberRole {
    INDEX_MEMBER_ROLE_UNSPECIFIED = 0;
    // changes the index's documents and members
    INDEX_MEMBER_ROLE_OWNER = 1;
    // reads and searches the index's documents
    INDEX_MEMBER_ROLE_READER = 2;
}

message IndexMember {
    string user = 1;
    IndexMemberRole role = 2;
}

message IndexResponse {
    string id = 1;
    string index_name = 2;
    // the user who created the index; always one of its owners until they are removed
    string owner = 3;
    string created_at = 4;
    string last_updated_at = 5;
    // everyone with a role on the index, the creator included
    repeated IndexMember members = 6;
}

message CreateIndexRequest {
    string index_name = 1;
    string owner = 2;
}

message GetIndexByNameRequest {
    string index_name = 1;
}

message GetIndexByIdRequest {
    string index_id = 1;
}

message ListIndexesRequest {
    // the indexes this user created
    string owner_name = 1;
    // the indexes this user has any role on; used instead of owner_name when set
    string member = 2;
}

message ListIndexesResponse {
    repeated IndexResponse indexes = 1;
}

message DeleteIndexByNameRequest {
    string index_name = 1;
}

message DeleteIndexByIdRequest {
   string index_id = 1;	
}

message DeleteOwnerIndexesRequest {
   string owner_name = 1;
}

message DeleteIndexResponse {
    bool success = 1;
}

message SetIndexMemberRequest {
    string index_name = 1;
    string user = 2;
    IndexMemberRole role = 3;
}

message RemoveIndexMemberRequest {
    string index_name = 1;
    string user = 2;
}
