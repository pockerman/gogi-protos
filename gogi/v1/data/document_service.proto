syntax = "proto3";
package gogi.v1;

option go_package = "gogi/gogi/v1;gogiv1";


message DocumentMetadata{
    string document_id = 1;
    string index_name = 2;
    string filename = 3;
    int32 chunk_count = 4;
    int32 page_count = 5;
    int32 word_count = 6;
}

message ListDocumentsRequest {
  string index_name = 1;
}

message ListDocumentsResponse{
    repeated DocumentMetadata documents = 1;
}

message GetDocumentRequest{
    string index_name = 1;
    string document_id = 2;

}

message GetDocumentResponse{
    DocumentMetadata document = 1;

}

message DeleteDocumentRequest{
    string index_name = 1;
    string document_id = 2;

}

message DeleteDocumentResponse{
    string response = 1;
}

message IngestDocumentRequest{

    string index_name = 1;
    string filename = 2;
    bytes content = 3;
    string content_type = 4;
    map<string, string> metadata = 5;
    string document_id = 6;
    string chunk_strategy = 7;
    string embeddings_model = 8;
    string embeddings_client = 9;
    int32 batch_size = 10;
    
}

message IngestDocumentJobResponse{
  string job_id = 1;
  string index_name = 2;
  string document_id = 3;
  string filename = 4;
  string status = 5;
  double progress = 6;
  string error_message = 7;

}
message GetIngestDocumentJobRequest{
    string job_id = 1;
}

message SearchDocumentsRequest{
    string index_name = 1;
    string query = 2;
    int32 top_k = 3;
    string embeddings_model = 4;
    string embeddings_client = 5;
    repeated string document_ids = 6;
    map<string, string> metadata_filter = 7;
}

message DocumentChunk{
    string chunk_id = 1;
    string document_id = 2;
    string index_name = 3;
    string content = 4;
    double score = 5;
    map<string, string> metadata = 6;
}

message SearchDocumentsResponse{
    repeated DocumentChunk chunks = 1;
}


service DocumentServer{

    rpc ListDocuments(ListDocumentsRequest) returns (ListDocumentsResponse);
    rpc GetDocument(GetDocumentRequest) returns (GetDocumentResponse);
    rpc DeleteDocument(DeleteDocumentRequest) returns (DeleteDocumentResponse);
    rpc IngestDocument(IngestDocumentRequest) returns (IngestDocumentJobResponse);
    rpc GetDocumentIngestJob(GetIngestDocumentJobRequest) returns (IngestDocumentJobResponse);
    rpc SearchDocuments(SearchDocumentsRequest) returns (SearchDocumentsResponse);

}

