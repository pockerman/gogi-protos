syntax = "proto3";
package gogi.v1;

option go_package = "gogi/gogi/v1;gogiv1";


message DocumentMetadata{
    string document_id = 1;
    string index_name = 2;
    string filename = 3;
    int32 chunk_count = 4;
    int32 page_count = 5;
    int32 word_count = 6;
    // the metadata the document was ingested with; every chunk of the document has it too
    map<string, string> metadata = 7;
    string content_type = 8;
    // the status of the document's ingestion job, e.g. PENDING, COMPLETED or FAILED
    string status = 9;
    string job_id = 10;
    // RFC 3339
    string created_at = 11;
    // the size of the uploaded file
    int64 size_bytes = 12;
}

message ListDocumentsRequest {
  string index_name = 1;
  // only the documents whose metadata has all of these keys and values
  map<string, string> metadata_filter = 2;
}

message ListDocumentsResponse{
    repeated DocumentMetadata documents = 1;
}

message GetDocumentRequest{
    string index_name = 1;
    string document_id = 2;

}

message GetDocumentResponse{
    DocumentMetadata document = 1;

}

message DeleteDocumentRequest{
    string index_name = 1;
    string document_id = 2;

}

message DeleteDocumentResponse{
    string response = 1;
    // the number of the document's chunks deleted from the vector store
    int32 chunks_deleted = 2;
}

message IngestDocumentRequest{

    string index_name = 1;
    string filename = 2;
    bytes content = 3;
    string content_type = 4;
    map<string, string> metadata = 5;
    string document_id = 6;
    string chunk_strategy = 7;
    string embeddings_model = 8;
    string embeddings_client = 9;
    int32 batch_size = 10;
    // keep and register the file without ingesting it, e.g. a video: it gets no chunks or sections
    bool store_only = 11;
    // replace the content of the existing document of document_id, e.g. after it was edited: its old
    // chunks and sections are deleted, any ingestion of the old content is stopped, and the new
    // content is ingested
    bool replace = 12;

}

// UploadDocument streams a document in parts: the first message carries the document's
// details (an IngestDocumentRequest without content), the rest carry its content in order.
// Use it for documents too large for a single gRPC message.
message UploadDocumentRequest{
    oneof part {
        IngestDocumentRequest info = 1;
        bytes chunk = 2;
    }
}

message IngestDocumentJobResponse{
  string job_id = 1;
  string index_name = 2;
  string document_id = 3;
  string filename = 4;
  string status = 5;
  double progress = 6;
  string error_message = 7;

}
message GetIngestDocumentJobRequest{
    string job_id = 1;
}

// A section of a document: a chapter or a heading within one, or a page of a PDF without an outline.
// A Markdown file's sections are its headings, a PDF's come from its outline, and a plain text file
// is a single section.
message DocumentSection{
    // 1-based, in the order of the document; identifies the section within its document
    int32 position = 1;
    // empty for text before a document's first heading
    string title = 2;
    // 1 for a chapter, 2 for a heading within it, and so on
    int32 level = 3;
    // the pages of a PDF the section is on; 0 for other documents
    int32 page_start = 4;
    int32 page_end = 5;
}

message ListDocumentSectionsRequest{
    string index_name = 1;
    string document_id = 2;
}

message ListDocumentSectionsResponse{
    repeated DocumentSection sections = 1;
}

message GetDocumentSectionRequest{
    string index_name = 1;
    string document_id = 2;
    int32 position = 3;
    // also return the sections within it, e.g. the headings of a chapter
    bool include_subsections = 4;
}

message DocumentSectionContent{
    DocumentSection section = 1;
    // the section's own text, without its subsections'
    string content = 2;
}

message GetDocumentSectionResponse{
    // the section, then its subsections in order if they were asked for
    repeated DocumentSectionContent sections = 1;
}

message DownloadDocumentRequest{
    string index_name = 1;
    string document_id = 2;
    // download only part of the file, e.g. for a video player seeking: the bytes from offset,
    // length of them; a length of 0 means to the end of the file
    int64 offset = 3;
    int64 length = 4;
}

// DownloadDocument streams the uploaded file: the document first, then its content in parts
message DownloadDocumentResponse{
    oneof part {
        DocumentMetadata document = 1;
        bytes chunk = 2;
    }
}

message SearchDocumentsRequest{
    string index_name = 1;
    string query = 2;
    int32 top_k = 3;
    string embeddings_model = 4;
    string embeddings_client = 5;
    repeated string document_ids = 6;
    map<string, string> metadata_filter = 7;
}

message DocumentChunk{
    string chunk_id = 1;
    string document_id = 2;
    string index_name = 3;
    string content = 4;
    double score = 5;
    map<string, string> metadata = 6;
}

message SearchDocumentsResponse{
    repeated DocumentChunk chunks = 1;
}


service DocumentServer{

    rpc ListDocuments(ListDocumentsRequest) returns (ListDocumentsResponse);
    rpc GetDocument(GetDocumentRequest) returns (GetDocumentResponse);
    rpc DeleteDocument(DeleteDocumentRequest) returns (DeleteDocumentResponse);
    rpc IngestDocument(IngestDocumentRequest) returns (IngestDocumentJobResponse);
    rpc UploadDocument(stream UploadDocumentRequest) returns (IngestDocumentJobResponse);
    rpc GetDocumentIngestJob(GetIngestDocumentJobRequest) returns (IngestDocumentJobResponse);
    rpc SearchDocuments(SearchDocumentsRequest) returns (SearchDocumentsResponse);
    rpc ListDocumentSections(ListDocumentSectionsRequest) returns (ListDocumentSectionsResponse);
    rpc GetDocumentSection(GetDocumentSectionRequest) returns (GetDocumentSectionResponse);
    rpc DownloadDocument(DownloadDocumentRequest) returns (stream DownloadDocumentResponse);

}

