syntax = "proto3";
package gogi.v1;

option go_package = "gogi/gogi/v1;gogiv1";

// The credentials of the application that calls: its model providers' keys, e.g. its Anthropic
// key stored as "anthropic", and the keys its registered models and tools need. A credential's
// value is kept in the platform's credential store and never given back; another application
// cannot use it.
service CredentialServer {

  // Store a credential; storing one the application already has replaces its value
  rpc StoreCredential(StoreCredentialRequest) returns (StoreCredentialResponse);

  // List the application's credentials, without their values
  rpc ListCredentials(ListCredentialsRequest) returns (ListCredentialsResponse);
}

// A credential, never its value
message Credential {
  string name = 1;
  // RFC 3339
  string created_at = 2;
  string updated_at = 3;
}

message StoreCredentialRequest {
  // lowercase letters, digits, '-' and '_'; "anthropic" and "openai" are the keys of the
  // built-in providers
  string name = 1;
  string value = 2;
}

message StoreCredentialResponse {
  Credential credential = 1;
}

message ListCredentialsRequest {}

message ListCredentialsResponse {
  repeated Credential credentials = 1;
}
